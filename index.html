<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-title" content="视频提取器">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%230f0f0f'/><rect width='512' height='512' rx='100' fill='url(%23g)'/><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%236366f1'/><stop offset='100%25' stop-color='%237c3aed'/></linearGradient></defs><text x='256' y='200' text-anchor='middle' font-size='140'>🎬</text><text x='256' y='380' text-anchor='middle' font-size='72' fill='white' font-weight='bold'>提取</text></svg>">
  <title>视频提取器 - Telegram & Twitter</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a2e;
      --surface2: #16213e;
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.3);
      --accent-tg: #2ea6ff;
      --accent-tw: #1d9bf0;
      --text: #e2e8f0;
      --text-secondary: #94a3b8;
      --border: #2d2d4a;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 16px;
      --radius-sm: 10px;
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      padding: 20px 16px;
      padding-bottom: calc(40px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      text-align: center;
      padding-top: 12px;
    }

    .header .logo {
      font-size: 36px;
      margin-bottom: 4px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header .subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .platform-badges {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 8px;
    }

    .platform-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .badge-tg {
      background: rgba(46, 166, 255, 0.12);
      color: var(--accent-tg);
      border: 1px solid rgba(46, 166, 255, 0.2);
    }

    .badge-tw {
      background: rgba(29, 155, 240, 0.12);
      color: var(--accent-tw);
      border: 1px solid rgba(29, 155, 240, 0.2);
    }

    .input-section {
      position: relative;
    }

    .input-wrapper {
      position: relative;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      transition: all 0.3s;
      overflow: hidden;
    }

    .input-wrapper:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }

    .input-wrapper.detected-tg {
      border-color: var(--accent-tg);
      box-shadow: 0 0 0 4px rgba(46, 166, 255, 0.15);
    }

    .input-wrapper.detected-tw {
      border-color: var(--accent-tw);
      box-shadow: 0 0 0 4px rgba(29, 155, 240, 0.15);
    }

    .input-wrapper.error {
      border-color: var(--danger);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15);
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      z-index: 2;
      pointer-events: none;
      transition: all 0.3s;
    }

    .url-input {
      width: 100%;
      padding: 16px 52px 16px 48px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      font-family: inherit;
    }

    .url-input::placeholder {
      color: var(--text-secondary);
      opacity: 0.6;
    }

    .paste-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      z-index: 2;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }

    .paste-btn:active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      transform: translateY(-50%) scale(0.95);
    }

    .clear-btn {
      position: absolute;
      right: 80px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      z-index: 2;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.2s;
      opacity: 0;
      pointer-events: none;
    }

    .clear-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .clear-btn:active {
      background: rgba(255,255,255,0.1);
    }

    .extract-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
      position: relative;
      overflow: hidden;
    }

    .extract-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .extract-btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .extract-btn .btn-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .extract-btn.loading .btn-text { display: none; }
    .extract-btn.loading .btn-spinner { display: block; }
    .btn-spinner { display: none; }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-msg {
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      min-height: 20px;
      transition: all 0.3s;
    }

    .status-msg.error { color: var(--danger); }
    .status-msg.success { color: var(--success); }

    .result-card {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      animation: slideUp 0.4s ease-out;
      display: none;
    }

    .result-card.visible {
      display: block;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .platform-tag {
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .platform-tag.tg { background: rgba(46,166,255,0.15); color: var(--accent-tg); }
    .platform-tag.tw { background: rgba(29,155,240,0.15); color: var(--accent-tw); }

    .result-title {
      flex: 1;
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-container {
      position: relative;
      width: 100%;
      background: #000;
    }

    .video-container video {
      width: 100%;
      display: block;
      max-height: 400px;
      object-fit: contain;
    }

    .video-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      font-size: 48px;
    }

    .result-actions {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
    }

    .download-btn {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .download-btn:active {
      transform: scale(0.95);
    }

    .btn-download {
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      color: #fff;
    }

    .btn-copy {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-share {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .history-section {
      margin-top: 4px;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .history-title {
      font-size: 16px;
      font-weight: 700;
    }

    .history-clear {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      padding: 4px 8px;
    }

    .history-empty {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      padding: 32px 0;
    }

    .history-empty .empty-icon {
      font-size: 40px;
      display: block;
      margin-bottom: 8px;
      opacity: 0.5;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .history-item:active {
      background: var(--surface2);
      transform: scale(0.98);
    }

    .history-platform {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .history-platform.tg { background: rgba(46,166,255,0.15); }
    .history-platform.tw { background: rgba(29,155,240,0.15); }

    .history-info {
      flex: 1;
      min-width: 0;
    }

    .history-url {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-time {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .history-arrow {
      color: var(--text-secondary);
      font-size: 16px;
      flex-shrink: 0;
    }

    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface2);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--border);
      z-index: 100;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .tips-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
    }

    .tips-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .tips-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tips-item {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.5;
    }

    .tips-item .dot {
      color: var(--primary);
      flex-shrink: 0;
    }

    .install-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 16px;
      padding-bottom: calc(14px + var(--safe-bottom));
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 50;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
    }

    .install-banner.show {
      transform: translateY(0);
    }

    .install-banner .banner-icon {
      font-size: 32px;
      flex-shrink: 0;
    }

    .install-banner .banner-text {
      flex: 1;
      min-width: 0;
    }

    .install-banner .banner-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .install-banner .banner-desc {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .install-btn {
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      font-family: inherit;
    }

    .install-dismiss {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      padding: 4px;
      margin-left: -4px;
    }

    .download-progress {
      display: none;
      padding: 0 16px 14px;
    }

    .download-progress.active {
      display: block;
    }

    .download-progress-bar {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .download-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #7c3aed);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .download-progress-text {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }

    .video-switcher {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .video-switcher.active {
      display: flex;
    }

    .video-switcher-arrow {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-family: inherit;
    }

    .video-switcher-arrow:active {
      background: var(--primary);
      border-color: var(--primary);
    }

    .video-switcher-indicator {
      font-size: 12px;
      color: var(--text-secondary);
      min-width: 60px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="logo">🎬</div>
      <h1>视频提取器 <span style="font-size:11px;color:#64748b;font-weight:400;">v12</span></h1>
      <p class="subtitle">支持 Telegram · Twitter / X 视频下载</p>
      <div class="platform-badges">
        <span class="platform-badge badge-tg">✈️ Telegram</span>
        <span class="platform-badge badge-tw">𝕏 Twitter</span>
      </div>
    </header>

    <div class="input-section">
      <div class="input-wrapper" id="inputWrapper">
        <span class="input-icon" id="inputIcon">🔗</span>
        <input
          type="url"
          class="url-input"
          id="urlInput"
          placeholder="粘贴 Telegram 或 Twitter 视频链接..."
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        >
        <button class="clear-btn" id="clearBtn" aria-label="清除">✕</button>
        <button class="paste-btn" id="pasteBtn">📋 粘贴</button>
      </div>
    </div>

    <button class="extract-btn" id="extractBtn" disabled>
      <span class="btn-content">
        <span class="btn-text">🎯 提取视频</span>
        <span class="btn-spinner"><span class="spinner"></span></span>
      </span>
    </button>

    <p class="status-msg" id="statusMsg"></p>

    <div class="result-card" id="resultCard">
      <div class="result-header">
        <span class="platform-tag" id="platformTag">TG</span>
        <span class="result-title" id="resultTitle"></span>
      </div>
      <div class="video-container" id="videoContainer">
        <div class="video-placeholder">🎥</div>
      </div>
      <div class="video-switcher" id="videoSwitcher">
        <button class="video-switcher-arrow" id="switcherPrev">◀</button>
        <span class="video-switcher-indicator" id="switcherIndicator">1/1</span>
        <button class="video-switcher-arrow" id="switcherNext">▶</button>
      </div>
      <div class="result-actions">
        <button class="download-btn btn-download" id="downloadBtn">
          ⬇️ 下载视频
        </button>
        <button class="download-btn btn-copy" id="copyBtn">
          📋 复制链接
        </button>
        <button class="download-btn btn-share" id="shareBtn">
          📤 分享
        </button>
      </div>
      <div class="download-progress" id="downloadProgress">
        <div class="download-progress-bar"><div class="download-progress-fill" id="downloadProgressFill"></div></div>
        <div class="download-progress-text" id="downloadProgressText"></div>
      </div>
    </div>

    <div class="tips-card">
      <div class="tips-title">💡 使用提示</div>
      <div class="tips-list">
        <div class="tips-item">
          <span class="dot">•</span>
          <span>Twitter 链接支持 <code>twitter.com</code> / <code>x.com</code> / <code>fxtwitter.com</code></span>
        </div>
        <div class="tips-item">
          <span class="dot">•</span>
          <span>Telegram 链接支持 <code>t.me</code> 公开频道的视频帖子</span>
        </div>
        <div class="tips-item">
          <span class="dot">•</span>
          <span>私密频道（<code>t.me/c/...</code>）会自动新标签页打开，需在浏览器登录过 <code>web.telegram.org</code></span>
        </div>
        <div class="tips-item">
          <span class="dot">•</span>
          <span>直接粘贴链接后点击「提取视频」即可</span>
        </div>
      </div>
    </div>

    <div class="history-section" id="historySection">
      <div class="history-header">
        <span class="history-title">📜 历史记录</span>
        <button class="history-clear" id="historyClearBtn">清空</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty">
          <span class="empty-icon">📭</span>
          <span>暂无记录</span>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="install-banner" id="installBanner">
    <span class="banner-icon">🎬</span>
    <div class="banner-text">
      <div class="banner-title">添加到主屏幕</div>
      <div class="banner-desc">像 App 一样使用，更快捷方便</div>
    </div>
    <button class="install-btn" id="installBtn">安装</button>
    <button class="install-dismiss" id="installDismiss">✕</button>
  </div>

  <script>
    (function() {
      const urlInput = document.getElementById('urlInput');
      const inputWrapper = document.getElementById('inputWrapper');
      const inputIcon = document.getElementById('inputIcon');
      const extractBtn = document.getElementById('extractBtn');
      const clearBtn = document.getElementById('clearBtn');
      const pasteBtn = document.getElementById('pasteBtn');
      const statusMsg = document.getElementById('statusMsg');
      const resultCard = document.getElementById('resultCard');
      const platformTag = document.getElementById('platformTag');
      const resultTitle = document.getElementById('resultTitle');
      const videoContainer = document.getElementById('videoContainer');
      const downloadBtn = document.getElementById('downloadBtn');
      const copyBtn = document.getElementById('copyBtn');
      const shareBtn = document.getElementById('shareBtn');
      const videoSwitcher = document.getElementById('videoSwitcher');

      const PROXIES = [
        (u) => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),

      // 统一抓取入口：Worker 优先 → 公共代理 → 全失败返回 null。
      // accept(resp) 返回非 null 表示接受这次响应（可顺势消费 body）；返回 null 则换下一个代理。
      async function fetchWithProxies(targetUrl, { timeout = 20000, signal = null, accept = null } = {}) {
        for (const build of proxyBuilders()) {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), timeout);
          const onOuterAbort = () => ctrl.abort();
          if (signal) signal.addEventListener('abort', onOuterAbort, { once: true });
          try {
            const resp = await fetch(build(targetUrl), { signal: ctrl.signal });
            if (!resp.ok) continue;
            if (!accept) return resp;
            const accepted = await accept(resp);
            if (accepted !== null && accepted !== undefined) return accepted;
          } catch {
            // 这个代理不行，换下一个
          } finally {
            clearTimeout(timer);
            if (signal) signal.removeEventListener('abort', onOuterAbort);
          }
        }
        return null;
      }

      function fetchText(targetUrl, opts = {}) {
        return fetchWithProxies(targetUrl, {

          }
        });

      function fetchJson(targetUrl, opts = {}) {
        return fetchWithProxies(targetUrl, {

      // 直连拉 JSON（不经过任何代理），用于本身就对 CORS 开放的接口，最快

        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeout);
        const onOuterAbort = () => ctrl.abort();
        if (signal) signal.addEventListener('abort', onOuterAbort, { once: true });
        try {
          const resp = await fetch(targetUrl, { signal: ctrl.signal });
          if (!resp.ok) return null;
          return await resp.json();

          clearTimeout(timer);
          if (signal) signal.removeEventListener('abort', onOuterAbort);

      // 多源并发竞速：谁先返回有效结果就用谁，其余立刻中断。
      // 原来 9 个源串行试，全失败要 2~5 分钟。
      function raceFirst(tasks, budgetMs = 20000) {
        return new Promise((resolve) => {
          if (!tasks || !tasks.length) return resolve(null);
          const ctrl = new AbortController();
          let pending = tasks.length;
          let settled = false;

          const finish = (winner) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            try { ctrl.abort(); } catch {}
            resolve(winner);
          };

          const timer = setTimeout(() => finish(null), budgetMs);

          for (const task of tasks) {
            Promise.resolve()
              .then(() => task.fn(ctrl.signal))
              .then((urls) => {
                if (urls && urls.length) finish({ name: task.name, urls });
              })
              .catch(() => {})
              .finally(() => {
                pending -= 1;
                if (pending === 0) finish(null);
              });
          }
        });

      // 下载硬上限：超过就放弃 Blob 方案，避免手机内存被打爆
      const MAX_DOWNLOAD_BYTES = 300 * 1024 * 1024;

      async function fetchVideoAsBlob(videoUrl, onProgress) {
        return fetchWithProxies(videoUrl, {
          timeout: 90000,
          accept: async (resp) => {
            const contentType = (resp.headers.get('content-type') || '').toLowerCase();
            // 代理返回 HTML 说明是错误页 / 拦截页，不是视频
            if (contentType.includes('text/html')) return null;

            const contentLength = parseInt(resp.headers.get('content-length') || '0', 10);
            if (contentLength > MAX_DOWNLOAD_BYTES) return null;
            if (!resp.body) return null;

            if (onProgress && contentLength) onProgress(0, contentLength);

            const reader = resp.body.getReader();
            const chunks = [];
            let received = 0;

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              received += value.length;
              if (received > MAX_DOWNLOAD_BYTES) {
                try { await reader.cancel(); } catch {}
                return null;
              }
              chunks.push(value);
              if (onProgress && contentLength) onProgress(received, contentLength);
            }

            const blob = new Blob(chunks, { type: contentType || 'video/mp4' });
            return blob.size > 1000 ? blob : null;
          }
        });

      function detectNSFWBlocked(html) {
        return /pornographic\s*content/i.test(html)

      function tryParseTGHtml(html) {
        let videoUrl = null;

        // 1. video tag src
        const vSrc = html.match(/<video[^>]+src=["\'"]([^"\'"]+)["\'"][^>]*>/i);
        if (vSrc) videoUrl = vSrc[1];

        // 2. data-video-src / data-video-url (Telegram embed)
        if (!videoUrl) {
          const dataVideo = html.match(/data-video-src=["\'"]([^"\'"]+)["\'"]/i)
            || html.match(/data-video-url=["\'"]([^"\'"]+)["\'"]/i);
          if (dataVideo) videoUrl = dataVideo[1];
        }

        // 3. source tag
        if (!videoUrl) {
          const sourceMatch = html.match(/<source[^>]+src=["\'"]([^"\'"]+)["\'"][^>]*>/i);
          if (sourceMatch) videoUrl = sourceMatch[1];
        }

        // 4. og:video meta tags
        if (!videoUrl) {
          const ogVideo = html.match(/<meta\s+property=["\'"]og:video["\'"][^>]+content=["\'"]([^"\'"]+)["\'"]/i)
            || html.match(/<meta\s+property=["\'"]og:video:url["\'"][^>]+content=["\'"]([^"\'"]+)["\'"]/i)
            || html.match(/<meta\s+property=["\'"]og:video:secure_url["\'"][^>]+content=["\'"]([^"\'"]+)["\'"]/i)
            || html.match(/<meta\s+property=["\'"]twitter:player:stream["\'"][^>]+content=["\'"]([^"\'"]+)["\'"]/i);
          if (ogVideo) videoUrl = ogVideo[1];
        }

        // 5. TG embed player params (tgme_player_params / videoData / playerData)
        if (!videoUrl) {
          const scripts = html.match(/<script[^>]*>([\s\S]*?)<\/script>/gi);
          if (scripts) {
            for (const script of scripts) {
              const jsonMatch = script.match(/(?:var|let|const|window\.)?\s*(?:tgme_player_params|videoData|playerData|tgmePlayerParams|playerParams)\s*=\s*(\{[\s\S]*?\})\s*;?/i);
              if (jsonMatch) {
                try {
                  const data = JSON.parse(jsonMatch[1]);
                  videoUrl = data?.video?.src || data?.video?.url || data?.src || data?.url || data?.file || data?.video_url || null;
                  if (videoUrl) break;
                } catch {}
              }
            }
          }
        }

        // 6. Inline JSON with video src (various patterns)
        if (!videoUrl) {
          const anyJson = html.match(/"video"\s*:\s*\{[^}]*"src"\s*:\s*"([^"]+)"/)
            || html.match(/"src"\s*:\s*"(https?:\/\/[^"]*\.(?:mp4|webm)[^"]*)"/)
            || html.match(/"url"\s*:\s*"(https?:\/\/[^"]*\.(?:mp4|webm)[^"]*)"/)
            || html.match(/"video_url"\s*:\s*"(https?:\/\/[^"]+)"/)
            || html.match(/"file"\s*:\s*"(https?:\/\/[^"]*\.mp4[^"]*)"/);
          if (anyJson) videoUrl = anyJson[1].replace(/\\\//g, "/");
        }

        // 7. Raw MP4/WebM/MOV URL in HTML
        if (!videoUrl) {
          const rawMP4 = html.match(/(https?:\/\/[^\s"\'<>]+\.(?:mp4|webm|mov))/i);
          if (rawMP4) videoUrl = rawMP4[1];
        }

        // 8. Telegram CDN direct URLs
        if (!videoUrl) {
          const tgCDN = html.match(/https?:\/\/cdn\d?\.(?:telesco\.pe|telegram\.org)\/[^\s"\'<>]+\.(?:mp4|webm)/i)
            || html.match(/https?:\/\/video\.(?:telesco\.pe|telegram\.org)\/[^\s"\'<>]+\.(?:mp4|webm)/i);
          if (tgCDN) videoUrl = tgCDN[0];
        }

        return videoUrl;
      }

      async function extractTelegramVideo(url) {

            }
          } catch {
            // 后端不可用，继续走本地代理
          }
        }

        // --- 策略 B：经代理抓页面后本地解析 ---
        setStatus('正在通过代理解析...', '');

        const pageVariants = [];
        if (/t\.me\/c\/\d+/.test(cleanUrl)) {
          pageVariants.push(cleanUrl + '?embed=1&mode=tme');
          pageVariants.push(cleanUrl + '?embed=1');
        } else {
          // t.me/s/ 端点实测有 13 个 <video> 标签，最可靠，放第一个
          pageVariants.push(cleanUrl.replace(/t\.me\//, 't.me/s/'));
          pageVariants.push(cleanUrl + '?embed=1&mode=tme');
          pageVariants.push(cleanUrl + '?embed=1');
          pageVariants.push(cleanUrl);
        }

        const deadline = Date.now() + TG_BUDGET_MS;

        for (const pageUrl of pageVariants) {
          const remaining = deadline - Date.now();
          if (remaining <= 1000) break;

          setStatus('正在尝试 ' + pageUrl + ' ...', '');
          const html = await fetchPageViaProxy(pageUrl, Math.min(15000, remaining));
          if (!html) continue;

          if (detectNSFWBlocked(html)) {
            throw { nsfwBlocked: true, channelUrl: cleanUrl };
          }

          let videoUrl = tryParseTGHtml(html);
          if (videoUrl) {
            if (videoUrl.startsWith('//')) videoUrl = 'https:' + videoUrl;
            if (videoUrl.startsWith('/')) {
              try {
                videoUrl = new URL(cleanUrl).origin + videoUrl;
              } catch {}
            }
            return videoUrl.replace(/^http:\/\//i, 'https://');
          }
        }

        throw new Error('解析失败：后端起不来，公共代理也都被拦截了。请稍后重试，或直接点「在 Telegram 中打开」。');
      }



      // 码率上限：以前专挑最高码率，4K 25 Mbps 的整段读进内存做 Blob，手机上必 OOM。
      // 4.5 Mbps 大约是 720p 的量级，清晰度够用、体积友好。
      // 想要原画可以在控制台执行 localStorage.setItem('ve_max_bitrate', '0') 关掉上限。
      function maxBitrate() {
        const raw = localStorage.getItem('ve_max_bitrate');
        if (raw === '0') return Infinity;
        const n = parseInt(raw, 10);
        return n > 0 ? n : 4500000;
      }

      function pickBestVariant(variants) {
        if (!variants || !variants.length) return null;

        const mp4 = variants
          .map((v) => ({ url: v.url, bitrate: parseInt(v.bitrate, 10) || 0 }))
          .filter((v) => v.url && /\.mp4(\?|$)/i.test(v.url));
        if (!mp4.length) return null; // 只剩 m3u8：交给调用方用 v.url 兜底，别把流地址当下载地址

        mp4.sort((a, b) => a.bitrate - b.bitrate);
        const cap = maxBitrate();
        const underCap = mp4.filter((v) => v.bitrate > 0 && v.bitrate <= cap);
        if (underCap.length) return underCap[underCap.length - 1].url; // 上限以内最高的
        return mp4[mp4.length - 1].url; // 全超上限就退到最低的 mp4
      }

      function parseFxTwitterAll(data) {
        if (data.code === 404 || !data.tweet) return [];
        const tweet = data.tweet;
        const media = tweet.media;
        if (!media || !media.all || !media.all.length) return [];
        const videos = media.all.filter(m => m.type === 'video' || m.type === 'gif');
        return videos.map(v => {
          let url = v.url;
          if (v.variants && v.variants.length) {
            const best = pickBestVariant(v.variants);
            if (best) url = best;
          }
          return url;
        }).filter(Boolean);
      }

      function parseSyndicationAll(data) {
        if (!data || !data.mediaDetails) return [];
        const videos = data.mediaDetails.filter(m => m.type === 'video' || m.type === 'animated_gif');
        return videos.map(v => {
          if (v.videoInfo && v.videoInfo.variants) {
            const best = pickBestVariant(v.videoInfo.variants);
            if (best) return best;
          }
          return null;
        }).filter(Boolean);
      }

      // syndication 的 tweet-result 接口必须带 token，否则只返回一个 `{}`
      // （实测：无 token → len=2 的 `{}`；带 token → 2907 字节完整 JSON）。
      // 且它只允许 platform.twitter.com 跨域，所以只能经后端/代理访问。
      const SYNDICATION_TOKEN = 'a';

      function syndicationUrl(tweetId) {
        return `https://cdn.syndication.twimg.com/tweet-result?id=${tweetId}&lang=en&token=${SYNDICATION_TOKEN}`;
      }

      // 已删除的失效解析源（实测证据，删除避免白等 2~5 分钟）：
      //   twitsave               —— 页面早就不含 window.__NUXT__，downloads / mp4 也都是 0 次命中
      //   platform.twitter.com   —— /embed/Tweet.html 只返回 429 字节的 <div id="app"></div> JS 壳
      //   Nitter（3 个实例）      —— nitter.net 已退役成落地页、nitter.poast.org 拒绝连接、
      //                              nitter.privacydev.net 证书不受信
      //   api.vxtwitter.com      —— 一律 403

      async function extractTwitterVideo(url) {
        const tweetMatch = url.match(/(?:twitter\.com|x\.com|fxtwitter\.com|vxtwitter\.com|fixupx\.com)\/\w+\/status\/(\d+)/i);
        if (!tweetMatch) {
          throw new Error('无效的 Twitter 链接格式');
        }

        const tweetId = tweetMatch[1];

        // 三源并发竞速，谁先拿到就用谁，其余立刻 abort。
        // fxtwitter 实测 200 且 ACAO:*，浏览器可以直连，是唯一稳定可用的源。
        const sources = [
          {
            name: 'fxtwitter 直连',
            fn: async (signal) => {
              const data = await fetchJsonDirect(`https://api.fxtwitter.com/status/${tweetId}`, { timeout: 8000, signal });
              return data ? parseFxTwitterAll(data) : [];
            }
          },
          {
            name: 'fxtwitter 经后端',
            fn: async (signal) => {
              const data = await fetchJson(`https://api.fxtwitter.com/status/${tweetId}`, { timeout: 12000, signal });
              return data ? parseFxTwitterAll(data) : [];
            }
          },
          {
            name: 'syndication 经后端',
            fn: async (signal) => {
              const data = await fetchJson(syndicationUrl(tweetId), { timeout: 12000, signal });
              return data ? parseSyndicationAll(data) : [];
            }
          }
        ];

        setStatus('正在解析 Twitter 视频...', '');
        const winner = await raceFirst(sources, 20000);
        if (winner) {
          setStatus('✅ 解析成功（' + winner.name + '）', 'success');
          return winner.urls;
        }

        throw new Error('所有解析方式均失败，可能是该推文为私密账号或包含限制内容');
      }

      async function extractVideo() {

      // window.open 如果不是发生在用户手势的同一个任务里（我们前面 await 过网络请求），

      function openExternal(url, tip) {

        setTimeout(() => URL.revokeObjectURL(pageUrl), 300000);
      }

      function formatSize(bytes) {
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      }

      function showDownloadProgress(received, total) {
        downloadProgress.classList.add('active');
        const pct = Math.round((received / total) * 100);
        downloadProgressFill.style.width = pct + '%';
        downloadProgressText.textContent = formatSize(received) + ' / ' + formatSize(total) + ' (' + pct + '%)';
      }

      function hideDownloadProgress() {
        downloadProgress.classList.remove('active');
        downloadProgressFill.style.width = '0%';
        downloadProgressText.textContent = '';
      }

      function triggerDownload(blob, filename) {
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(blobUrl); }, 60000);
        return true;
      }

          return;
        }

        showToast('正在下载...');
        hideDownloadProgress();
        const isMobile = isMobileDevice();

        const ext = url.match(/\.(mp4|mov|webm)($|\?)/i);
        const fileExt = ext ? ext[1] : 'mp4';
        const cfg = PLATFORM_CONFIG[currentPlatform] || { name: 'Video' };
        const filename = `${cfg.name}_video_${Date.now()}.${fileExt}`;

        let blob = null;

        try {
          blob = await fetchVideoAsBlob(url, showDownloadProgress);
        } catch { hideDownloadProgress(); }

        hideDownloadProgress();

        if (blob && blob.size > 1000) {
          triggerDownload(blob, filename);

          if (isMobile) {
            showToast('✅ 下载完成！请在下载记录或文件中查看');
          } else {
            showToast('✅ 下载完成！');
          }
          currentIsDownloaded = true;
          return;
        }

        if (isMobile && /twimg\.com/i.test(url)) {
          openVideoDownloadPage(url);
          showToast('代理下载失败，已在新标签页打开长按保存');
          return;
        }

        openExternal(url, '代理下载失败，请点下方链接打开后长按保存');
        showToast('下载失败，已在新标签页打开，请长按保存');
      }

      async function copyVideoUrl() {
        const url = getCurrentVideoUrl();
        if (!url) return;
        try {
          await navigator.clipboard.writeText(url);
          showToast('✅ 链接已复制到剪贴板');
        } catch {
          const ta = document.createElement('textarea');
          ta.value = url;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast('✅ 链接已复制到剪贴板');
        }
      }

      async function shareVideo() {
        const url = getCurrentVideoUrl();
        if (!url) return;
        if (navigator.share) {
          try {
            await navigator.share({
              title: '视频链接',
              text: currentSourceUrl,
              url: url
            });
          } catch {}
        } else {
          copyVideoUrl();
        }
      }

      urlInput.addEventListener('input', () => {
        const url = urlInput.value.trim();
        clearBtn.classList.toggle('visible', url.length > 0);

        if (url.length === 0) {
          inputWrapper.classList.remove('detected-tg', 'detected-tw', 'error');
          inputIcon.textContent = '🔗';
          extractBtn.disabled = true;
          setStatus('');
          return;
        }

        const platform = detectPlatform(url);
        updateInputUI(platform);
        if (!platform && url.length > 5) {
          setStatus('⚠️ 无法识别链接类型，请检查链接格式', '');
        }
      });

      urlInput.addEventListener('paste', () => {
        setTimeout(() => {
          const url = urlInput.value.trim();
          clearBtn.classList.toggle('visible', url.length > 0);
          const platform = detectPlatform(url);
          updateInputUI(platform);
        }, 100);
      });

      clearBtn.addEventListener('click', () => {
        urlInput.value = '';
        urlInput.focus();
        inputWrapper.classList.remove('detected-tg', 'detected-tw', 'error');
        inputIcon.textContent = '🔗';
        extractBtn.disabled = true;
        setStatus('');
        clearBtn.classList.remove('visible');
      });

      pasteBtn.addEventListener('click', async () => {
        try {
          const text = await navigator.clipboard.readText();
          if (text) {
            urlInput.value = text.trim();
            const platform = detectPlatform(urlInput.value.trim());
            updateInputUI(platform);
            clearBtn.classList.add('visible');
            urlInput.dispatchEvent(new Event('input'));
          }
        } catch {
          urlInput.focus();
          showToast('请手动粘贴链接');
        }
      });

      extractBtn.addEventListener('click', extractVideo);
      downloadBtn.addEventListener('click', downloadVideo);
      copyBtn.addEventListener('click', copyVideoUrl);
      shareBtn.addEventListener('click', shareVideo);
      historyClearBtn.addEventListener('click', clearAllHistory);

      switcherPrev.addEventListener('click', () => {
        if (currentVideoIndex > 0) switchToVideo(currentVideoIndex - 1);
      });
      switcherNext.addEventListener('click', () => {
        if (currentVideoIndex < currentVideoUrls.length - 1) switchToVideo(currentVideoIndex + 1);
      });

      const installBanner = document.getElementById('installBanner');
      const installBtn = document.getElementById('installBtn');
      const installDismiss = document.getElementById('installDismiss');
      let deferredPrompt = null;

      function showInstallBanner() {
        const dismissed = localStorage.getItem('pwa_install_dismissed');
        if (dismissed) return;
        if (window.matchMedia('(display-mode: standalone)').matches) return;
        installBanner.classList.add('show');
      }

      function hideInstallBanner() {
        installBanner.classList.remove('show');
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showInstallBanner();
      });

      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const result = await deferredPrompt.userChoice;
          deferredPrompt = null;
          hideInstallBanner();
        } else {
          showToast('请使用浏览器菜单中的「添加到主屏幕」');
        }
      });

      installDismiss.addEventListener('click', () => {
        hideInstallBanner();
        localStorage.setItem('pwa_install_dismissed', '1');
      });

      window.addEventListener('appinstalled', () => {
        hideInstallBanner();
        deferredPrompt = null;
        showToast('✅ 安装成功！可在桌面找到应用');
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(() => {
          setTimeout(showInstallBanner, 2000);
        }).catch(() => {});
      }

      renderHistory();
    })();
  </script>
</body>
</html>
